name: Supabase keep-alive

# Free Supabase projects pause after ~7 days with no API activity, which takes
# account login and cross-device progress sync offline. This workflow sends a
# tiny public request to the project twice a week so the inactivity timer never
# reaches 7 days.
#
# NOTE: this keeps an ACTIVE project awake — it cannot un-pause one that has
# already paused. Restore a paused project once from the Supabase dashboard;
# afterwards this job keeps it warm indefinitely.
#
# The key below is the PUBLIC "publishable" (anon) key already shipped in
# data/auth-config.js — safe to expose; the database is protected by RLS.

on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC daily — GitHub can skip/delay cron runs
                              # under load, so daily keeps a wide safety margin
                              # against the ~7-day inactivity pause.
  workflow_dispatch: {}        # lets you run it on demand from the Actions tab

# Prevent overlapping runs
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase to reset the inactivity timer
        run: |
          URL="https://kggkdxfszgougikcjhzn.supabase.co/rest/v1/learning_progress?select=key&limit=1"
          KEY="sb_publishable_3ktqBX14e6B4Pi70vZxWEw_564oRbMf"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL" || echo "000")
          echo "Supabase REST responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::warning::Could not reach the project — it may be paused. Restore it from the Supabase dashboard; this job will keep it awake afterwards."
          else
            echo "Project is active — inactivity timer reset (any HTTP response counts as activity)."
          fi
