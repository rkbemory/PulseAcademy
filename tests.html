<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Tests — Pulse for Nurses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="Photo & Logo/Pulse For Nurses Logo.png">
</head>
<body>

<header class="top-nav">
  <div class="top-nav-inner">
    <a href="index.html" class="brand-logo">
      <img src="Photo & Logo/Pulse For Nurses Logo.png" alt="" class="brand-img">
      <span class="brand-text">
        <span class="brand-name">Pulse For Nurses</span>
      </span>
    </a>
    <nav class="top-nav-links">
      <a href="msn.html">MSN</a>
      <a href="post-basic.html">Post Basic</a>
      <a href="rn.html">BNMC RN</a>
      <a href="books.html">Books</a>
    </nav>
  </div>
</header>

<section class="tests-hero">
  <div class="tests-hero-inner">
    <div class="breadcrumb"><a href="index.html">Home</a> › <span id="program-name">All Tests</span></div>
    <h1 id="hero-title">All Tests</h1>
    <p class="tests-hero-sub" id="hero-sub">Topic check-ins, model tests, and full simulations.</p>
  </div>
</section>

<div class="tests-tabs" id="program-tabs">
  <a class="tests-tab" data-program="msn" href="tests.html?program=msn">MSN</a>
  <a class="tests-tab" data-program="post-basic" href="tests.html?program=post-basic">Post Basic</a>
  <a class="tests-tab" data-program="rn" href="tests.html?program=rn">BNMC RN</a>
</div>

<main class="block">
  <div id="tests-catalog"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom"><span>© 2026 Pulse for Nurses.</span><span><a href="index.html">← Back to home</a></span></div>
  </div>
</footer>

<script src="data/pulse-core.js"></script>
<script src="data/msn.js"></script>
<script src="data/post-basic.js"></script>
<script src="data/rn.js"></script>
<script src="data/pulse-loader.js"></script>
<script src="quiz-engine.js"></script>
<script src="scripts.js"></script>
<script>
  const programId = PulseQuiz.getProgramId();
  const prog = Pulse.getProgram(programId);
  document.getElementById("hero-title").textContent = prog.name + " — All Tests";
  document.getElementById("hero-sub").textContent = prog.tagline;
  document.getElementById("program-name").textContent = prog.name;
  document.querySelectorAll("#program-tabs .tests-tab").forEach(function (a) {
    if (a.dataset.program === programId) a.classList.add("is-active");
  });
  PulseQuiz.renderCatalog("#tests-catalog", programId);
</script>
</body>
</html>
